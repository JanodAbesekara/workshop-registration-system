spring.application.name=workshop-registration-service
server.port=8080

#  MySQL 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#  Security 
# MUST be overridden in production (min 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES}
app.cors.allowed-origins=${CORS_ORIGINS}

# Seed data 
app.seed.admin-name=Seed Admin
app.seed.admin-email=${SEED_ADMIN_EMAIL}
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.demo-data=${SEED_DEMO}

# Misc 
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
